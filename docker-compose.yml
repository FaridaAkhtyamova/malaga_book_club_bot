services:
  postgres:
    image: postgres:16-alpine
    container_name: book_club_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-book_club}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-book_club}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: book_club_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  bot:
    build: .
    container_name: book_club_bot
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
